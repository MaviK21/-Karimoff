# Karimoff — nginx reverse proxy, ФИНАЛЬНАЯ конфигурация (TLS)
# Устанавливается командой `deploy.sh tls` ПОСЛЕ фактического выпуска
# сертификата (certonly --webroot). До этого используется karimoff-http.conf.
# DOMAIN подставляется deploy.sh (sed). Домен: karimoff.pro.

# --- Редирект HTTP -> HTTPS + ACME challenge ---
server {
    listen 80;
    listen [::]:80;
    server_name karimoff.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Основной HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name karimoff.pro;

    # Сертификаты выпускаются certbot'ом ДО установки этого конфига.
    ssl_certificate     /etc/letsencrypt/live/karimoff.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karimoff.pro/privkey.pem;

    # TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:karimoff_ssl:10m;
    ssl_session_tickets off;

    # HSTS — только в финальном HTTPS-конфиге
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    # Лимит тела запроса: самый большой multipart-бакет приложения
    # (adminProducts) = 300 МБ, запас ~7%.
    client_max_body_size 320m;
    client_body_timeout 360s;

    # Сжатие текстовых ответов (приложение не сжимает само)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    access_log /var/log/nginx/karimoff.access.log;
    error_log  /var/log/nginx/karimoff.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Большие multipart-загрузки по медленным каналам
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 15s;

        # Заголовки безопасности уже ставит приложение (nosniff, CSP и т.д.) —
        # nginx их не переопределяет и не дублирует.
    }
}
