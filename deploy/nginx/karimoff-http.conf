# Karimoff — nginx, НАЧАЛЬНАЯ конфигурация (до выпуска TLS)
# Устанавливается provision'ом в /etc/nginx/sites-available/karimoff.
# После `deploy.sh tls` заменяется на karimoff.conf (HTTP->HTTPS + TLS).
# DOMAIN подставляется deploy.sh (sed). Домен: karimoff.pro.

server {
    listen 80;
    listen [::]:80;
    server_name karimoff.pro;

    # Let's Encrypt (certbot certonly --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    server_tokens off;

    # Тот же лимит, что и в TLS-конфиге (adminProducts = 300 МБ)
    client_max_body_size 320m;
    client_body_timeout 360s;

    access_log /var/log/nginx/karimoff.access.log;
    error_log  /var/log/nginx/karimoff.error.log;

    # Сайт работает по HTTP, пока TLS не выпущен.
    # Заголовки безопасности ставит приложение.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 15s;
    }
}
